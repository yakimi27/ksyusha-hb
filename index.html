<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ксюша — 18</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stage1.css">
  <link rel="stylesheet" href="css/stage2.css">
  <link rel="stylesheet" href="css/stage3.css">
</head>
<body>
  <div id="app-root">
    <section id="stage-1" class="stage stage1-overlay is-active">
      <div class="stage1-container">
        <div class="stage1-sublabel">18th Anniversary</div>
        <div class="stage1-heading-wrapper">
          <h1 id="stage1-heading" class="stage1-heading">Оберіть мову</h1>
        </div>
        <div id="stage1-options" class="stage1-options">
          <button type="button" class="lang-btn" data-lang="uk">Українська</button>
          <button type="button" class="lang-btn" data-lang="ru">Русский</button>
          <button type="button" id="lang-btn-zh" class="lang-btn" data-lang="zh">中文</button>
        </div>
      </div>
      <div id="easter-egg-overlay" class="easter-egg-overlay" role="dialog" aria-modal="true" aria-label="Easter Egg">
        <img src="media/vas.jpg" alt="Easter Egg" class="easter-egg-photo">
      </div>
    </section>
    <section id="stage-2" class="stage stage2-overlay is-hidden"></section>
    <section id="stage-3" class="stage stage3-main is-hidden"></section>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/stage1.js"></script>
  <script src="js/stage2.js"></script>
  <script src="js/stage3.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
